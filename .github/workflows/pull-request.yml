name: Pull Request

on:
  pull_request:
    branches: [main]
    # ready_for_review matters: draft pull requests skip the whole flow, so
    # without it a draft marked ready would never run.
    types: [opened, synchronize, reopened, ready_for_review]

# A called workflow cannot hold more permission than its caller grants. This is
# the union of what cloudflare-pr.yml's jobs declare.
permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

jobs:
  cloudflare:
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-pr.yml@d3096758fcd3e5bbc5a9622b8f1f5182b80aab86 # v1.7.1
    secrets:
      cloudflare-account-id: ${{ secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
      cloudflare-api-token: ${{ secrets.BURNT_CLOUDFLARE_API_TOKEN }}
